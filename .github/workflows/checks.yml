name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Builds the app, compiles scripts/Checks.cs against it, runs the release-lookup,
      # checksum, cache and download-verification checks, then runs --selftest.
      - name: Run checks
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/run-checks.ps1
